[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evomining"
version = "1.0.0"
description = "Enzyme family expansion analysis for biosynthetic gene cluster discovery"
requires-python = ">=3.9"
dependencies = ["numpy", "biopython"]

[project.scripts]
evomining = "evomining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
